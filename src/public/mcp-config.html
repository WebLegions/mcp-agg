<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Aggregator Configuration</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/digitallytailored/classless@latest/classless.min.css">
    <script>
        // Initialize theme
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme');
        const initialTheme = savedTheme ? savedTheme === 'dark' : prefersDark;
        document.documentElement.setAttribute('color-scheme', initialTheme ? 'dark' : 'light');
    </script>
</head>
<body>
    <!-- Juris library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/juris@0.9.0/juris.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/juris@0.9.0/juris-webcomponent.js"></script>

    <div id="app"></div>

    <!-- JurisJS Theme Toggle Web Component -->
    <juris-theme-toggle></juris-theme-toggle>

    <!-- Load application modules -->
    <script type="module" src="/app/main.ts"></script>
</body>
</html>
