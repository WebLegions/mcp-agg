<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastify Bun Starter</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/digitallytailored/classless@latest/classless.min.css">
    <style>
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .theme-toggle:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    <main>
        <header>
            <h1>Welcome! 👋</h1>
            <p>Fastify Bun Starter API Server</p>
        </header>

        <section>
            <h2>Quick Links</h2>
            <nav>
                <ul>
                    <li>
                        <a href="/api/v1/swagger">
                            <strong>📚 Swagger UI</strong><br>
                            Interactive API documentation and testing interface
                        </a>
                    </li>
                    <li>
                        <a href="/mcp">
                            <strong>🔌 MCP Endpoint</strong><br>
                            Model Context Protocol JSON-RPC interface
                        </a>
                    </li>
                    <li>
                        <a href="/health">
                            <strong>💚 Health Check</strong><br>
                            Server health and status information
                        </a>
                    </li>
                </ul>
            </nav>
        </section>

        <footer>
            <p>Powered by Fastify + Bun</p>
        </footer>
    </main>
    <script src="/theme.js"></script>
</body>
</html>
