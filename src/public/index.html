<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Aggregator</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- Classless CSS for base styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/digitallytailored/classless@latest/classless.min.css">

    <!-- Juris library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/juris@0.9.0/juris.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/juris@0.9.0/juris-cssextractor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/juris@0.9.0/juris-headless.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/juris@0.9.0/headless/juris-router.js"></script>

    <script>
        // Initialize theme before content loads to prevent flash
        const initialTheme = localStorage.getItem('theme') === 'dark' ||
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('color-scheme', initialTheme ? 'dark' : 'light');
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/app/main.ts"></script>
</body>

</html>
